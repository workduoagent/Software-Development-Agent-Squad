openapi: 3.1.0
info:
  title: Auth API (fixture)
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        "200":
          description: 登录成功
        "401":
          description: 凭据无效
