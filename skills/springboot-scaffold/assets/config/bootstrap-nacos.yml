# 微服务拓扑 bootstrap.yml 基线（放在各 app-server-* 模块的 resources 下）。
# 配置分层：本文件只留 Nacos 坐标 + 应用名；其余全部下沉到 Nacos。
# 机密（Nacos 账号、命名空间 ID）只能来自环境变量，禁止写死。

spring:
  application:
    name: ${APP_NAME:example-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      # 每份 import 都带 optional: 前缀——缺任何一份都能启动，本地开发不强依赖 Nacos
      - optional:nacos:common-config.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
      discovery:
        server-addr: ${NACOS_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE}

    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 30000
      httpclient:
        hc5:
          enabled: true

# 网关侧的静态路由只在 app-server-gateway 里配；业务服务不要互相写死 URL
# 服务间调用统一走服务名：http://app-server-xxx
