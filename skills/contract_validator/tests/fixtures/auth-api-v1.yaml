openapi: 3.1.0
info:
  title: 用户认证服务 API（测试夹具）
  version: 1.0.0
  description: contract_validator 回归测试用合法契约：注册 + 登录。
servers:
  - url: http://localhost:8080
x-error-codes:
  - code: 40001
    http_status: 400
    message: 参数校验失败
    trigger: 请求体缺少必填字段或格式错误
  - code: 40101
    http_status: 401
    message: 账号或密码错误
    trigger: 登录时密码错误或账号不存在
  - code: 40901
    http_status: 409
    message: 手机号已被注册
    trigger: 重复注册同一手机号
paths:
  /api/v1/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              normal:
                value:
                  phone: "13800000001"
                  password: "Passw0rd!"
                  nickname: "张三"
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterData'
              examples:
                success:
                  value:
                    code: 0
                    msg: ok
                    data:
                      userId: "7311234567890123456"
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                invalid:
                  value: { code: 40001, msg: 参数校验失败, data: null }
        '409':
          description: 手机号已被注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                conflict:
                  value: { code: 40901, msg: 手机号已被注册, data: null }
  /api/v1/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: 用户登录，签发 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normal:
                value:
                  phone: "13800000001"
                  password: "Passw0rd!"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginData'
              examples:
                success:
                  value:
                    code: 0
                    msg: ok
                    data:
                      token: "eyJhbGciOiJIUzI1NiJ9.demo.signature"
                      expiresIn: 7200
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                invalid:
                  value: { code: 40001, msg: 参数校验失败, data: null }
        '401':
          description: 账号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                unauthorized:
                  value: { code: 40101, msg: 账号或密码错误, data: null }
components:
  schemas:
    Result:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功，非 0 见 x-error-codes
        msg:
          type: string
          description: 人类可读提示
        data:
          description: 业务载荷；错误时为 null
    RegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        password:
          type: string
          minLength: 8
          maxLength: 64
        nickname:
          type: string
          maxLength: 32
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        password:
          type: string
          minLength: 8
          maxLength: 64
    RegisterData:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: 雪花 ID，字符串防前端精度丢失
    LoginData:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          minLength: 1
        expiresIn:
          type: integer
          description: 过期秒数
